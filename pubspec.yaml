name: aicovers
description: AI Covers Studio - create AI-powered cover songs from YouTube links.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod:
  go_router:
  shared_preferences:
  just_audio:
  just_audio_background:
  path_provider:
  cached_network_image:
  google_fonts:
  iconly:
  intl:
  url_launcher:
  lottie:
  flutter_animate:
  connectivity_plus:
  share_plus:
  device_info_plus:
  package_info_plus:
  shimmer:
  logger:
  freezed_annotation:
  json_annotation:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  build_runner:
  freezed:
  json_serializable:

flutter:
  uses-material-design: true
  assets:
    - lib/core/l10n/app_en.arb
    - lib/core/l10n/app_ar.arb
